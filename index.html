<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e8ecee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f171c" media="(prefers-color-scheme: dark)">
<title>Lenete Weather Montevideo</title>
<meta name="description" content="Pronóstico de lluvia y temperatura actual en Montevideo.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lenete Weather">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e8ecee;
  --surface: #f6f8f9;
  --ink: #15212a;
  --muted: #5d6c76;
  --line: #d3dade;
  --river: #2f5d74;
  --river-soft: #c9d9e1;
  --dry: #3d6b57;
  --dry-soft: #d5e4dc;
  --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f171c;
    --surface: #16222a;
    --ink: #e5ebee;
    --muted: #8d9ea8;
    --line: #243540;
    --river: #86b5cc;
    --river-soft: #1d3442;
    --dry: #8fc2a8;
    --dry-soft: #1b3128;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  padding: max(20px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
}
main { max-width: 440px; margin: 0 auto; }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.place { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .01em; }
.updated { font-size: 13px; color: var(--muted); }

.now { margin: 28px 0 8px; display: flex; align-items: flex-end; gap: 18px; }
.temp {
  font-size: clamp(88px, 28vw, 120px);
  font-weight: 300;
  line-height: .85;
  letter-spacing: -.045em;
  font-variant-numeric: tabular-nums;
}
.temp sup { font-size: .38em; font-weight: 300; vertical-align: top; position: relative; top: .12em; margin-left: .04em; letter-spacing: 0; }
.feels { font-size: 14px; color: var(--muted); padding-bottom: 6px; line-height: 1.35; }

.verdict {
  margin: 26px 0 6px;
  font-size: 22px;
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: -.01em;
  padding-left: 14px;
  border-left: 3px solid var(--dry);
}
.verdict.rainy { border-left-color: var(--river); }

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  margin-top: 22px;
  border-top: 1px solid var(--line);
}
.stat { padding: 14px 0; border-bottom: 1px solid var(--line); }
.stat:nth-child(odd) { padding-right: 14px; border-right: 1px solid var(--line); }
.stat:nth-child(even) { padding-left: 18px; }
.stat b { display: block; font-size: 24px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat b small { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.stat span { font-size: 13px; color: var(--muted); }

.hours-head { display: flex; justify-content: space-between; align-items: baseline; margin: 34px 0 6px; }
.hours-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.hours-head span { font-size: 12.5px; color: var(--muted); }

.hours { background: var(--surface); border-radius: 14px; padding: 4px 16px; }
.day { font-size: 13px; font-weight: 600; color: var(--muted); padding: 14px 0 6px; text-transform: none; }
.row {
  display: grid;
  grid-template-columns: 48px 1fr 40px 62px;
  align-items: center;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.row:last-child { border-bottom: none; }
.row.first .h { font-weight: 600; }
.h { color: var(--ink); }
.bar { position: relative; height: 8px; background: var(--river-soft); border-radius: 4px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--river); border-radius: 4px; }
.prob { text-align: right; font-weight: 500; }
.prob.na, .mm.na { color: var(--muted); font-weight: 400; }
.mm { text-align: right; color: var(--muted); font-size: 13px; }
.t { display: none; }

.actions { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 12px; }
button {
  font: inherit; font-size: 14px; font-weight: 500;
  color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 18px; cursor: pointer;
}
button:hover { background: var(--surface); }
button:focus-visible { outline: 2px solid var(--river); outline-offset: 2px; }
button[disabled] { opacity: .5; cursor: default; }
.source { font-size: 12px; color: var(--muted); line-height: 1.4; text-align: right; }

.foot { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
.foot a { color: inherit; text-underline-offset: 2px; }
.foot a:focus-visible { outline: 2px solid var(--river); outline-offset: 2px; }
.msg { margin-top: 40px; font-size: 15px; color: var(--muted); }
.error { margin-top: 28px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border-left: 3px solid #c0463a; font-size: 14px; line-height: 1.45; }
.error strong { display: block; margin-bottom: 4px; }
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .5s ease; }
}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="place">Lenete Weather Montevideo</div>
    <div class="updated" id="updated">&nbsp;</div>
  </div>
  <div id="app" aria-live="polite"><p class="msg">Cargando datos meteorológicos…</p></div>
  <div class="actions">
    <button id="refresh" type="button">Actualizar</button>
    <div class="source">Modelo ECMWF IFS 0.25°</div>
  </div>
<footer class="foot">Desarrollado por Lenete App &bull; Datos meteorológicos vía <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
</main>

<script>
const URL_API = "https://api.open-meteo.com/v1/forecast"
  + "?latitude=-34.9033&longitude=-56.1882"
  + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m"
  + "&hourly=precipitation_probability,precipitation,temperature_2m"
  + "&models=ecmwf_ifs025&forecast_days=2&timezone=America%2FMontevideo";

const app = document.getElementById('app');
const updatedEl = document.getElementById('updated');
const btn = document.getElementById('refresh');

const isNum = v => typeof v === 'number' && isFinite(v);
const fmt0 = v => isNum(v) ? Math.round(v) : null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function dayLabel(dateStr, todayStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const [ty, tm, td] = todayStr.split('-').map(Number);
  const diff = Math.round((new Date(y, m - 1, d) - new Date(ty, tm - 1, td)) / 86400000);
  const long = new Date(y, m - 1, d).toLocaleDateString('es-UY', { weekday: 'long', day: 'numeric', month: 'long' });
  const cap = long.charAt(0).toUpperCase() + long.slice(1);
  return diff === 1 ? 'Mañana, ' + long : cap;
}

function render(data) {
  const cur = data.current || {};
  const h = data.hourly;

  // La API ya devuelve la hora local de Montevideo: se compara como texto, sin depender del reloj del dispositivo.
  const nowStr = cur.time || h.time[0];
  const todayStr = nowStr.slice(0, 10);
  const hourStart = nowStr.slice(0, 13) + ':00';

  let start = h.time.findIndex(t => t >= hourStart);
  if (start < 0) start = 0;

  const rows = [];
  let totalMm = 0, maxProb = null, hasProb = false;

  for (let i = start; i < h.time.length && rows.length < 24; i++) {
    const prob = h.precipitation_probability ? h.precipitation_probability[i] : null;
    const mm = h.precipitation ? h.precipitation[i] : null;
    if (isNum(mm)) totalMm += mm;
    if (isNum(prob)) { hasProb = true; if (maxProb === null || prob > maxProb) maxProb = prob; }
    rows.push({ time: h.time[i], prob, mm, temp: h.temperature_2m ? h.temperature_2m[i] : null });
  }

  // Veredicto: mismos umbrales que la versión original, pero sin inventar datos faltantes.
  let cls = 'dry', verdict = 'No se esperan lluvias significativas.';
  if (hasProb) {
    if (maxProb >= 70) { cls = 'rainy'; verdict = 'Alta probabilidad de lluvia. Llevá paraguas.'; }
    else if (maxProb >= 30) { cls = 'rainy'; verdict = 'Probabilidad de lluvias aisladas o lloviznas.'; }
  } else if (totalMm >= 0.1) {
    cls = 'rainy'; verdict = 'Se estima precipitación en las próximas 24 horas.';
  }

  const temp = fmt0(cur.temperature_2m);
  const feel = fmt0(cur.apparent_temperature);
  const hum = fmt0(cur.relative_humidity_2m);
  const wind = fmt0(cur.wind_speed_10m);

  let list = '', lastDay = todayStr;
  rows.forEach((r, idx) => {
    const day = r.time.slice(0, 10);
    if (day !== lastDay) { list += `<div class="day">${esc(dayLabel(day, todayStr))}</div>`; lastDay = day; }
    const p = isNum(r.prob) ? Math.round(r.prob) : null;
    const m = isNum(r.mm) ? r.mm.toFixed(1) : null;
    list += `
      <div class="row${idx === 0 ? ' first' : ''}">
        <span class="h">${idx === 0 ? 'Ahora' : r.time.slice(11, 16)}</span>
        <span class="bar" aria-hidden="true"><i style="width:${p === null ? 0 : p}%"></i></span>
        <span class="prob${p === null ? ' na' : ''}">${p === null ? '–' : p + '%'}</span>
        <span class="mm${m === null ? ' na' : ''}">${m === null ? '–' : m + ' mm'}</span>
      </div>`;
  });

  app.innerHTML = `
    <div class="now">
      <div class="temp">${temp === null ? '–' : temp}<sup>°C</sup></div>
      ${feel === null ? '' : `<div class="feels">Sensación<br>térmica ${feel}°</div>`}
    </div>
    <div class="verdict ${cls}">${esc(verdict)}</div>
    <div class="stats">
      <div class="stat"><b>${hasProb ? maxProb + '<small>%</small>' : '–'}</b><span>Probabilidad máxima</span></div>
      <div class="stat"><b>${totalMm.toFixed(1)}<small>mm</small></b><span>Acumulado estimado</span></div>
      <div class="stat"><b>${hum === null ? '–' : hum + '<small>%</small>'}</b><span>Humedad</span></div>
      <div class="stat"><b>${wind === null ? '–' : wind + '<small>km/h</small>'}</b><span>Viento</span></div>
    </div>
    <div class="hours-head"><h2>Próximas 24 horas</h2><span>Probabilidad y milímetros</span></div>
    <div class="hours">${list}</div>
  `;

  updatedEl.textContent = 'Datos de las ' + nowStr.slice(11, 16);
}

async function load() {
  btn.disabled = true;
  try {
    const res = await fetch(URL_API, { cache: 'no-store' });
    if (!res.ok) throw new Error('El servidor respondió con el código ' + res.status + '.');
    const data = await res.json();
    if (!data.hourly || !data.hourly.time) throw new Error('La respuesta no trae datos horarios.');
    render(data);
  } catch (e) {
    app.innerHTML = '<div class="error"><strong>No se pudieron cargar los datos.</strong><span></span></div>';
    app.querySelector('.error span').textContent = e.message + ' Revisá tu conexión y probá de nuevo.';
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener('click', load);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(load, 10 * 60 * 1000);
load();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
